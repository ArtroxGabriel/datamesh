<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataMesh Monitor · Gestão do Sistema</title>
  <style>
    :root {
      --bg: #edf2f7;
      --card-bg: #ffffff;
      --border: #d1d9e6;
      --border-input: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0066cc;
      --primary-hover: #0052a3;
      --green: #0a8754;
      --red: #dc2626;
      --amber: #b45309;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 1.25rem 2rem 2.5rem 2rem;
      line-height: 1.4;
    }
    main { max-width: 1120px; margin: 0 auto; display: grid; gap: 1.1rem; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
    .brand { display: flex; align-items: flex-start; gap: 0.75rem; }
    .badge-dcim {
      background-color: #0b2545; color: #ffffff; font-weight: 800; font-size: 0.95rem;
      padding: 0.35rem 0.65rem; border-radius: 6px; letter-spacing: 0.05em; height: 28px;
      display: inline-flex; align-items: center;
    }
    .brand-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); line-height: 28px; }
    .brand-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }
    .header-right { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .nav-link {
      font-size: 0.8rem; font-weight: 600; color: var(--primary); text-decoration: none;
      padding: 0.3rem 0.7rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg);
    }
    .nav-link:hover { border-color: var(--primary); }
    .pill {
      color: #ffffff; font-size: 0.72rem; font-weight: 700; padding: 0.35rem 0.85rem;
      border-radius: 20px; letter-spacing: 0.04em; background: var(--text-muted);
    }
    .pill.secure, .pill.on { background: var(--green); }
    .pill.insecure, .pill.off { background: var(--red); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    .card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.1rem 1.25rem; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .card h2 {
      font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-muted); margin-bottom: 0.85rem;
    }
    .inline { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    button, input, select {
      font: inherit; font-size: 0.875rem; border-radius: 6px; padding: 0.5rem 0.85rem;
      border: 1px solid var(--border-input); background: #ffffff; color: var(--text-main);
    }
    button { font-weight: 600; cursor: pointer; transition: background-color 0.15s, border-color 0.15s; }
    button:hover:not(:disabled) { border-color: var(--primary); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #ffffff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-green { background: var(--green); border-color: var(--green); color: #ffffff; }
    .btn-red { background: var(--red); border-color: var(--red); color: #ffffff; }
    .btn-amber { background: #fffbeb; border-color: #fcd34d; color: var(--amber); }
    .status { font-size: 0.85rem; font-weight: 600; color: var(--amber); min-height: 1.2rem; }
    .dev {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: 8px;
      margin-top: 0.5rem; background: #f8fafc; text-align: left;
    }
    .dev.active { border-color: var(--primary); background: #eff6ff; }
    .dev small { color: var(--text-muted); font-weight: 500; margin-left: 0.35rem; }
    .state-tag { font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 999px; color: #ffffff; }
    .state-tag.on { background: var(--green); }
    .state-tag.off { background: var(--red); }
    .drawer {
      margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <span class="badge-dcim">DCIM</span>
      <div>
        <h1 class="brand-title">Menu Operacional</h1>
        <p class="brand-subtitle">Gestão do Sistema · Subir, parar, anomalias e fontes dinâmicas (:8082)</p>
      </div>
    </div>
    <div class="header-right">
      <a class="nav-link" href="http://127.0.0.1:8080" target="_blank">Dashboard (:8080)</a>
      <a class="nav-link" href="http://127.0.0.1:8081" target="_blank">Security Lab (:8081)</a>
      <span id="conn" class="pill">CONECTANDO…</span>
      <span id="mode" class="pill">—</span>
    </div>
  </header>

  <div id="status" class="status"></div>

  <div class="grid">
    <section class="card">
      <h2>Sistema &amp; Modo de Segurança</h2>
      <div class="inline">
        <button class="btn-primary" onclick="call('/api/action',{action:'stack_up'})">Subir (up)</button>
        <button class="btn-red" onclick="call('/api/action',{action:'stack_down'})">Parar (down)</button>
        <button class="btn-green" onclick="call('/api/mode',{mode:'secure'})">Modo SEGURO</button>
        <button class="btn-red" onclick="call('/api/mode',{mode:'insecure'})">Modo INSEGURO</button>
      </div>
    </section>

    <section class="card">
      <h2>Adicionar Nova Fonte</h2>
      <div class="inline">
        <select id="src-type">
          <option value="temp">Temperatura</option>
          <option value="pdu">PDU</option>
        </select>
        <input id="src-param" placeholder="Base (°C ou W, opcional)" style="flex:1;min-width:160px">
        <button class="btn-primary" onclick="addSource()">Adicionar</button>
      </div>
    </section>
  </div>

  <section class="card">
    <h2>Dispositivos <span style="font-weight:400;text-transform:none">(clique em um dispositivo para escolher a ação)</span></h2>
    <div id="devices">Aguardando dados…</div>
    <div id="drawer" class="drawer" hidden>
      <div><strong id="sel-name"></strong> <span id="sel-kind" style="color:var(--text-muted)"></span></div>
      <div class="inline">
        <button class="btn-green" onclick="act('start_source')">Ligar (up)</button>
        <button class="btn-red" onclick="act('stop_source')">Parar (down)</button>
        <button id="btn-anom" class="btn-amber" onclick="act('anomaly')">Disparar Anomalia</button>
        <button id="btn-rm" class="btn-red" onclick="act('remove_source')">Remover</button>
      </div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const BASE = { 'ac-01-carnot': 'ac', 'temp-01-turing': 'temp', 'pdu-01-tesla': 'pdu' };
let selected = null, lastState = {};

async function call(path, body) {
  try {
    const r = await fetch(path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw Error(d.detail || 'Falha');
    const target = d.target || body.target;
    $('status').textContent = 'Executado: ' + (body.action || body.mode) + (target ? ' (' + target + ')' : '');
  } catch (e) { $('status').textContent = e.message; }
}

function addSource() {
  call('/api/action', {
    action: 'add_source', source_type: $('src-type').value, param: $('src-param').value.trim()
  });
}

function act(action) { if (selected) call('/api/action', { action, target: selected }); }
function pick(id) { selected = id; render(lastState); }

function render(s) {
  lastState = s;
  $('conn').textContent = s.ready ? 'CONECTADO' : s.switching ? 'REINICIANDO' : 'PARADO';
  $('conn').className = 'pill ' + (s.ready ? 'on' : 'off');
  const m = s.security?.mode;
  $('mode').textContent = m === 'secure' ? 'SEGURO' : m === 'insecure' ? 'INSEGURO' : '—';
  $('mode').className = 'pill ' + (m || '');
  if (s.switch_error) $('status').textContent = s.switch_error;

  const byId = new Map((s.devices || []).map(d => [d.device_id, d]));
  const extras = new Set(s.extras || []);
  const ids = [...new Set([...Object.keys(BASE), ...extras, ...byId.keys()])];

  $('devices').innerHTML = ids.map(id => {
    const on = byId.get(id)?.is_online;
    const tag = extras.has(id) ? 'extra' : (BASE[id] ? 'base' : '');
    return `<button class="dev ${selected === id ? 'active' : ''}" onclick="pick('${id}')">
      <span><strong>${id}</strong><small>${tag}</small></span>
      <span class="state-tag ${on ? 'on' : 'off'}">${on ? 'ONLINE' : 'OFFLINE'}</span>
    </button>`;
  }).join('');

  if (selected && ids.includes(selected)) {
    $('drawer').hidden = false;
    $('sel-name').textContent = selected;
    const isExtra = extras.has(selected);
    const isAc = selected === 'ac-01-carnot' || byId.get(selected)?.device_type === 'AIR_CONDITIONER';
    $('sel-kind').textContent = isExtra ? '(extra)' : '(base)';
    $('btn-anom').hidden = isAc;
    $('btn-rm').hidden = !isExtra;
  } else {
    $('drawer').hidden = true;
  }
  document.querySelectorAll('button').forEach(b => b.disabled = !!s.switching);
}

const stream = new EventSource('/api/stream');
stream.onmessage = e => { try { render(JSON.parse(e.data)); } catch {} };
</script>
</body>
</html>
