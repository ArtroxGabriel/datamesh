services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: datamesh-python:latest
    command: ["python", "-m", "gateway.main"]
    network_mode: host
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_TCP_PORT: "9997"
      TELEMETRY_UDP_PORT: "9998"
      MULTICAST_GROUP: "239.255.0.1"
      MULTICAST_PORT: "9999"
      DB_PATH: "/app/data/datamesh.db"
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped

  ac:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: datamesh-python:latest
    command: ["python", "-m", "sources.ac.main"]
    network_mode: host
    environment:
      AC_DEVICE_ID: "ac-rack-01"
      AC_GRPC_PORT: "50051"
      AC_ADVERTISED_IP: "127.0.0.1"
      GATEWAY_HOST: "127.0.0.1"
      GATEWAY_PORT: "9998"
      SEND_INTERVAL_SEC: "3.0"
      MULTICAST_GROUP: "239.255.0.1"
      MULTICAST_PORT: "9999"
    depends_on:
      - gateway
    restart: unless-stopped

  temperature:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: datamesh-python:latest
    command: ["python", "-m", "sources.temperature.main"]
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      SENSOR_ID: "temp-rack-01"
      GATEWAY_HOST: "127.0.0.1"
      GATEWAY_PORT: "9998"
      SEND_INTERVAL_SEC: "3.0"
      MULTICAST_GROUP: "239.255.0.1"
      MULTICAST_PORT: "9999"
    depends_on:
      - gateway
    restart: unless-stopped

  pdu:
    build:
      context: .
      dockerfile: Dockerfile.pdu
    image: datamesh-pdu:latest
    network_mode: host
    environment:
      PDU_DEVICE_ID: "pdu-rack-01"
      GATEWAY_HOST: "127.0.0.1"
      GATEWAY_PORT: "9998"
      SEND_INTERVAL_SEC: "3.0"
      MULTICAST_GROUP: "239.255.0.1"
      MULTICAST_PORT: "9999"
    depends_on:
      - gateway
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: datamesh-python:latest
    command: ["python", "-m", "client.main"]
    network_mode: host
    environment:
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8080"
      GATEWAY_HOST: "127.0.0.1"
      GATEWAY_PORT: "9997"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  gateway-data:
