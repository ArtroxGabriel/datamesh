version: '3'

tasks:
  default:
    desc: Run full verification pipeline (proto + lint + test)
    cmds:
      - task: check

  proto:
    desc: Generate Python and Go code from proto/datamesh.proto
    cmds:
      - bash scripts/build_protos.sh

  lint:
    desc: Run linters, format checks, and type checks (Python & Go)
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run ty check
      - go vet ./sources/pdu/...

  test:
    desc: Run Python and Go test suites with coverage check (>=80%)
    cmds:
      - uv run pytest
      - go test -v ./sources/pdu/...

  check:
    desc: Execute complete validation pipeline (proto -> lint -> test)
    cmds:
      - task: proto
      - task: lint
      - task: test

  demo:
    desc: Launch interactive multi-rack demo console (Gateway, Client, AC, 2x Temp, 2x PDU)
    cmds:
      - bash scripts/run_demo.sh

  lab:
    desc: Launch interactive Docker security lab menu (insecure/secure, anomalies, attacks)
    cmds:
      - bash scripts/run_lab.sh

  lab-up:
    desc: Provision lab credentials and start Docker lab (pass `-- --rebuild` to rebuild images)
    cmds:
      - bash scripts/security/setup_lab.sh
      - |
        BUILD_FLAG=""
        if [[ " {{.CLI_ARGS}} " == *" --rebuild "* ]]; then
          BUILD_FLAG="--build"
        fi
        docker compose -p datamesh-security-lab -f compose.lab.yml --profile attack up -d --force-recreate $BUILD_FLAG

  lab-down:
    desc: Stop Docker security lab containers
    cmds:
      - docker compose -p datamesh-security-lab -f compose.lab.yml --profile attack down --remove-orphans

  lab-clean:
    desc: Stop lab, remove extra containers, purge Docker volumes and generated lab credentials
    cmds:
      - docker ps -aq --filter name=^datamesh-extra- | xargs -r docker rm -f
      - docker compose -p datamesh-security-lab -f compose.lab.yml --profile attack down -v --remove-orphans
      - rm -rf .datamesh-security .datamesh-security-state

  smoke:
    desc: Run automated end-to-end smoke test across all local processes
    cmds:
      - bash scripts/run_demo.sh --smoke

  clean:
    desc: Stop background processes, purge cache/databases, and rebuild artifacts
    cmds:
      - bash scripts/clean.sh

  cleanup:
    desc: Alias for clean
    cmds:
      - task: clean
