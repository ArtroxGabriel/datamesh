version: '3'

tasks:
  default:
    desc: Run full verification pipeline (proto + lint + test)
    cmds:
      - task: check

  proto:
    desc: Generate Python and Go code from proto/datamesh.proto
    cmds:
      - bash scripts/build_protos.sh

  lint:
    desc: Run linters, format checks, and type checks (Python & Go)
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run ty check
      - go vet ./sources/pdu/...

  test:
    desc: Run Python and Go test suites with coverage check (>=80%)
    cmds:
      - uv run pytest
      - go test -v ./sources/pdu/...

  check:
    desc: Execute complete validation pipeline (proto -> lint -> test)
    cmds:
      - task: proto
      - task: lint
      - task: test

  demo:
    desc: Launch interactive multi-rack demo console (Gateway, Client, AC, 2x Temp, 2x PDU)
    cmds:
      - bash scripts/run_demo.sh

  smoke:
    desc: Run automated end-to-end smoke test across all local processes
    cmds:
      - bash scripts/run_demo.sh --smoke
